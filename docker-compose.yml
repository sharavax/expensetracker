version: '3.8'

services:
  expense-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-expense-tracker:latest
    container_name: spendwise-app
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
