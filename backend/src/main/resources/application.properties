# Dynamic Port: uses Render's $PORT environment variable in cloud, or defaults to 8081 locally
server.port=${PORT:8081}

# ==============================================================================
# Database Configuration
# Works with:
# 1. Render PostgreSQL: when SPRING_DATASOURCE_URL or DB_HOST is set
# 2. Local MySQL: default fallback to localhost:3306/expensetracker
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensetracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate automatically detects the dialect (PostgreSQLDialect, MySQLDialect, etc.) from the JDBC URL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
