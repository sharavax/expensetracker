databases:
  - name: expensedb
    databaseName: expensedb
    user: expenseuser
    plan: free
    region: oregon

services:
  - type: web
    name: spendwise-expense-tracker
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: expensedb
          property: host
      - key: DB_PORT
        fromDatabase:
          name: expensedb
          property: port
      - key: DB_NAME
        fromDatabase:
          name: expensedb
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: expensedb
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: expensedb
          property: password